[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "holdet-lib"
version = "0.1.0"
description = "Unofficial Holdet.dk fantasy data library, CLI, and local dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["platformdirs>=4.11,<5", "xlsxwriter>=3.2,<4"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
website = ["streamlit>=1.60,<2", "starlette>=0.50,<1"]
parquet = ["pyarrow>=23,<24"]
test = ["pytest>=9,<10"]
ui-test = [
    "playwright>=1.61,<2",
    "pytest-playwright>=0.8,<1",
    "pillow>=12.3,<13",
]

[project.scripts]
holdet = "cli.main:main"

[tool.setuptools.packages.find]
include = ["holdet_lib*", "cli*", "website*"]
