[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "holdet-lib"
version = "0.1.0"
description = "Unofficial Holdet.dk fantasy data library, CLI, and local dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["platformdirs>=4.11.1,<5", "xlsxwriter>=3.2.9,<4"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
website = [
    "streamlit>=1.61.1,<2",
    "starlette>=1.3.1,<1.4",
    "pandas>=3.0.5,<4",
    "altair>=6.2.2,<7",
]
parquet = ["pyarrow>=24,<25"]
test = ["pytest>=9.1.1,<10", "httpx2>=2.10,<3"]
ui-test = [
    "playwright>=1.62,<2",
    "pytest-playwright>=0.8,<1",
    "pillow>=12.3,<13",
]

[project.scripts]
holdet = "cli.main:main"

[tool.setuptools.packages.find]
include = ["holdet_lib*", "cli*", "website*"]
